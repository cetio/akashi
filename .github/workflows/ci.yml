name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest

      - name: Cache DUB packages and build cache
        uses: actions/cache@v4
        env:
          DUB_CACHE_KEY: dub-v1-${{ runner.os }}-${{ runner.arch }}-ldc-latest
        with:
          path: |
            ${{ runner.temp }}/dub/packages
            ${{ runner.temp }}/dub/cache
          key: ${{ env.DUB_CACHE_KEY }}-${{ hashFiles('dub.json', 'dub.selections.json') }}
          restore-keys: |
            ${{ env.DUB_CACHE_KEY }}-

      - name: Build library
        env:
          DUB_HOME: ${{ runner.temp }}/dub
        run: dub build --compiler=ldc2 --config=library

      - name: Run offline tests
        env:
          DUB_HOME: ${{ runner.temp }}/dub
        run: dub test --compiler=ldc2 --config=library
